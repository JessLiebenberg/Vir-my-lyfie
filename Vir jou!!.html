
<!DOCTYPE html>
<html lang="af">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>'n Klein Vragie vir Jou 💗</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(
                135deg,
                #ffe6f0,
                #e4f2ff,
                #fff7d6,
                #e4f8e9
            );
        }

        .card {
            width: 90%;
            max-width: 550px;
            padding: 45px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.72);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            box-shadow: 0 12px 40px rgba(180, 145, 180, 0.18);
            position: relative;
            z-index: 2;
        }

        .heart {
            font-size: 55px;
            animation: heartbeat 1.5s infinite;
        }

        .little-text {
            color: #c47b9b;
            font-size: 14px;
            letter-spacing: 2px;
            margin-top: 15px;
        }

        h1 {
            color: #6388bb;
            font-size: clamp(28px, 7vw, 42px);
            margin: 18px 0;
        }

        .subtitle {
            color: #9c83b5;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .button-area {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 65px;
        }

        button {
            border: none;
            border-radius: 50px;
            padding: 14px 30px;
            font-size: 17px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.2s;
            touch-action: manipulation;
        }

        #yes-button {
            background: #f6b5d0;
            color: #814563;
            box-shadow: 0 5px 12px #f4c7d9;
        }

        #yes-button:hover {
            transform: scale(1.08);
            box-shadow: 0 7px 18px #eeb2cc;
        }

        #no-button {
            background: #b9dcfa;
            color: #42658b;
            box-shadow: 0 5px 12px #c9e3fa;
            position: relative;
            z-index: 5;
        }

        .footer {
            color: #b49bb9;
            font-size: 13px;
            margin-top: 35px;
        }

        .floating-heart {
            position: fixed;
            bottom: -40px;
            opacity: 0.6;
            pointer-events: none;
            animation: float-up linear infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        @keyframes float-up {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            15% { opacity: 0.6; }
            to {
                transform: translateY(-115vh) rotate(35deg);
                opacity: 0;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 35px 15px;
            }

            .button-area {
                gap: 12px;
            }

            button {
                padding: 12px 24px;
            }
        }
    </style>
</head>

<body>

    <main class="card">
        <div class="heart">💗</div>

        <p class="little-text">♡ 'N KLEIN VRAGIE VIR JOU ♡</p>

        <h1>Is jy lief vir my?</h1>

        <p class="subtitle">
            Kies versigtig, mooi man... 🦋
        </p>

        <div class="button-area" id="button-area">
            <button id="yes-button" onclick="sayYes()">
                Ja 💕
            </button>

            <button id="no-button" type="button">
                Nee 🙃
            </button>
        </div>

        <p class="footer">
            Gemaak met liefde, net vir jou ♡
        </p>
    </main>

    <script>
        const noButton = document.getElementById("no-button");
        const buttonArea = document.getElementById("button-area");

        function moveNoButton() {
            const maxX = Math.max(
                0,
                buttonArea.clientWidth - noButton.offsetWidth
            );

            const maxY = Math.max(
                0,
                buttonArea.clientHeight - noButton.offsetHeight
            );

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            noButton.style.position = "absolute";
            noButton.style.left = x + "px";
            noButton.style.top = y + "px";
        }

        noButton.addEventListener("mouseenter", moveNoButton);

        noButton.addEventListener("touchstart", function(event) {
            event.preventDefault();
            moveNoButton();
        }, { passive: false });

        noButton.addEventListener("click", function(event) {
            event.preventDefault();
            moveNoButton();
        });

        function sayYes() {
            window.location.href = "page2.html";
        }

        // Floating pastel hearts
        const heartEmojis = ["💗", "🩵", "💛", "💚", "💕"];

        for (let i = 0; i < 18; i++) {
            const heart = document.createElement("span");

            heart.className = "floating-heart";
            heart.textContent = heartEmojis[
                Math.floor(Math.random() * heartEmojis.length)
            ];

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (14 + Math.random() * 18) + "px";
            heart.style.animationDuration = (8 + Math.random() * 12) + "s";
            heart.style.animationDelay = (-Math.random() * 20) + "s";

            document.body.appendChild(heart);
        }
    </script>

</body>
</html>
